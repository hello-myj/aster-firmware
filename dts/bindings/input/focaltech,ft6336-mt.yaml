# SPDX-License-Identifier: MIT
description: FocalTech FT6336 two-point capacitive touch controller
compatible: "focaltech,ft6336-mt"
include: i2c-device.yaml
properties:
  screen-width:
    type: int
    required: true
    description: Raw controller X coordinate extent in pixels
  screen-height:
    type: int
    required: true
    description: Raw controller Y coordinate extent in pixels
  poll-interval-ms:
    type: int
    default: 20
    description: Polling interval in milliseconds
