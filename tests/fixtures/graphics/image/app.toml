[app]
id = "test.p2.gfx.image"
name = "GFX benchmark image"
version = "1.0.0"
abi = "3.7.0"
abi_min = "3.7"
aot = true
optimize = "Os"
initial_memory = 524288
max_memory = 2097152
heap = 524288
stack = 16384
requires = ["display"]
permissions = ["fs"]
assets = ["assets/color.bmp", "assets/black.bmp"]
sources = ["src/main.c"]
