
#
# System and hardware
#
CONFIG_ASTER_SYSTEM_ZEPHYR=y
# CONFIG_ASTER_HW_LCKFB_S3 is not set
CONFIG_ASTER_HW_WAVESHARE_35B=y
# end of System and hardware

#
# Startup display (launcher is portrait; APPs select their orientation)
#
CONFIG_ASTER_BOOT_PORTRAIT=y
# CONFIG_ASTER_BOOT_HEADLESS is not set
# end of Startup display (launcher is portrait; APPs select their orientation)

#
# Firmware services
#
CONFIG_ASTER_CFG_AUDIO=y
CONFIG_ASTER_CFG_WIFI=y
CONFIG_ASTER_CFG_LAUNCHER=y
CONFIG_ASTER_CFG_USB_CONSOLE=y
# end of Firmware services

CONFIG_ASTER_GFX_TIMING=y
CONFIG_ASTER_DISP_TIMING=y
