# No-camera profile overlay: reference board with the DVP camera compiled out.
# Build (board conf is auto-loaded, this overlay stacks on top):
#   west build -b esp32s3_devkitc/esp32s3/procpu firmware \
#     -- -DEXTRA_CONF_FILE=boards/no_camera.conf
#
# Guards the hardware-neutral split in aster_platform.h: ASTER_PLAT_CAM_W/H are
# visible on every build (the runtime validates an app buffer against them
# even with no camera), while camera.c and the `hw cam` subcommand drop out.
# ASTER_FEATURE_CAMERA is derived from CONFIG_ASTER_CAMERA, so apps that
# requires=["camera"] are refused at install and aster_cam_* return ASTER_ENODEV.
CONFIG_ASTER_CAMERA=n
