# AXS15231B 320x480 native portrait; landscape via software rotation.
CONFIG_ASTER_PANEL_AXS15231B=y
CONFIG_ASTER_APP_SPACE_MAX=480
# Launcher high-water is about 22 KB. Screenshots read the glass frame and
# compress it; they no longer allocate a full frame from this pool.
CONFIG_ASTER_LVGL_MEM_KB=64
CONFIG_ASTER_AXS15231B_TOUCH=y
CONFIG_ASTER_DISPLAY_ROTATION=0
CONFIG_ASTER_SYSTEM_UI_ENABLE=y
CONFIG_ASTER_LAUNCHER_NATIVE=y
CONFIG_ASTER_LAUNCHER_FLUX=y
CONFIG_ASTER_LVGL=y
CONFIG_ASTER_LVGL_BAND_ROWS=80
CONFIG_ASTER_LVGL_PROFILER=n
CONFIG_ASTER_DISP_PSRAM_STAGE=y
CONFIG_ASTER_DISP_ASYNC=y
# Panel-canvas apps (2048 and the other full-screen games) draw into these
# two fronts. Without them the firmware falls back to a guest framebuffer
# that does not fit the default 256 KB app heap.
CONFIG_ASTER_DISP_FLIP_DBUF=y
# Enable these explicitly for profiling; normal games should not log per-frame batches.
CONFIG_ASTER_DISP_TIMING=n
CONFIG_ASTER_GFX_TIMING=n
CONFIG_ASTER_SCREENSHOT=y
CONFIG_ASTER_IMGDEC=y
CONFIG_ASTER_IMGDEC_SHELL=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
