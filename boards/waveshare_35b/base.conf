# Waveshare ESP32-S3-Touch-LCD-3.5B: board buses, power and services.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ASTER_EXIT_KEY_CODE=11
CONFIG_SPI_ESP32_DMA_CHUNK_SIZE=16384
# Direct PSRAM DMA caused moving horizontal/rectangular artifacts on glass.
# Use internal-RAM bounce + GDMA; preserve completion fencing.
CONFIG_SPI_ESP32_TX_PSRAM_DIRECT=n
CONFIG_LED=y
CONFIG_SENSOR=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_DMA=y
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=48
CONFIG_ASTER_AUDIO=y
CONFIG_I2S=y
CONFIG_I2S_LOG_LEVEL_INF=y
CONFIG_ASTER_WIFI=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=n
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=n
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
# Larger cache lines reduce external-RAM traffic for framebuffers/textures.
CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
CONFIG_ESP32S3_DATA_CACHE_64KB=y
CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
CONFIG_ESP_SPIRAM_SIZE=8388608
# Do not copy Flash .text into PSRAM, and do not keep the cache on
# during flash programming. Flash and octal PSRAM share one MSPI;
# turning both of those on makes a cache miss hit a busy flash chip.
# Guest AOT text is a separate PSRAM allocation executed through the
# instruction-bus alias. The panel DMA path stays on the internal bounce.
CONFIG_SPIRAM_FETCH_INSTRUCTIONS=n
CONFIG_SPIRAM_RODATA=n
CONFIG_ESPTOOLPY_OCT_FLASH=n
CONFIG_MULTI_HEAP=y
CONFIG_SHARED_MULTI_HEAP=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=7864320
# Reserve 96 KiB for kernel allocations and upcoming network services.
# Keep the verified display buffers; monitor the reduced libc heap too.
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_ASTER_APP_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=6144
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BOOT_BANNER=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ASTER_BOARD_ID="aster.esp32s3.waveshare35b"
CONFIG_ASTER_PLATFORM="zephyr"
CONFIG_ASTER_SOC="esp32s3"
CONFIG_ASTER_CPU_ARCH_XTENSA=y
CONFIG_ASTER_CPU_FREQ_HZ=240000000
CONFIG_ASTER_CPU_COUNT=2
CONFIG_ASTER_RAM_INTERNAL=0x50000
CONFIG_ASTER_RAM_EXTERNAL=0x800000
CONFIG_ASTER_FLASH_SIZE=0x1000000
# Cap on one guest's linear memory. This is the external heap (7.5 MiB of
# the 8 MiB part), not a block reserved at boot. The live ceiling is this
# value or the largest free block minus two full frames (614400 B) and a
# small heap-header slack, whichever is smaller. Those fronts are taken
# when a canvas surface is created. A screenshot does not keep a buffer.
CONFIG_ASTER_WAMR_HEAP_SIZE=7864320
CONFIG_ASTER_HAS_FILESYSTEM=y
CONFIG_ASTER_HAS_PSRAM=y
CONFIG_ASTER_HAS_RTC=y
CONFIG_RTC=y
CONFIG_RTC_INIT_PRIORITY=90
CONFIG_REGULATOR=y
CONFIG_REGULATOR_AXP192_AXP2101=y
CONFIG_REGULATOR_AXP192_AXP2101_INIT_PRIORITY=86
CONFIG_MFD=y
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_SPI_EXTENDED_MODES=y
CONFIG_ASTER_AUDIO_ADC_ES8311=y
# IMU stays off on this board. Touch, codec and RTC still share I2C0;
# the QMI8658A is disabled in the board DTS.
CONFIG_ASTER_HAS_ACCEL=n
CONFIG_ASTER_HAS_GYRO=n
CONFIG_ASTER_HAS_KEYS=y
