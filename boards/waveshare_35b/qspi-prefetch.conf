# Optional 40 MHz internal-RAM prefetch profile verified on Waveshare 3.5B.
# Pixel/control: 40 MHz; PSRAM direct DMA remains disabled.
CONFIG_ASTER_SYSTEM_ZEPHYR=y
CONFIG_ASTER_HW_WAVESHARE_35B=y
CONFIG_ASTER_BOOT_PORTRAIT=y
# Camera is an optional external module; no sensor driver selected.
CONFIG_ASTER_CFG_CAMERA=n
CONFIG_ASTER_CFG_AUDIO=y
CONFIG_ASTER_CFG_WIFI=y
CONFIG_ASTER_CFG_LAUNCHER=y

CONFIG_ASTER_CFG_USB_CONSOLE=y

CONFIG_ASTER_AXS_PIXEL_CLOCK_MHZ=40
CONFIG_ASTER_AXS_TX_PREFETCH=y

# Restore the verified 48 KiB kernel heap and two 8 KiB bands.
CONFIG_HEAP_MEM_POOL_SIZE=49152
