# App-space scaling profile: the reference board, with the guest's coordinate
# space halved on both axes (320x240 panel -> 160x120 app space).
# Build (on top of the board conf):
#   west build -b esp32s3_devkitc/esp32s3/procpu firmware \
#     -- -DEXTRA_CONF_FILE=boards/app_space_qvga.conf
# or via the profile tool: bash sdk/tools/check_profiles.sh
#
# This profile exists because the scaling path is the one piece of the display
# port the reference board cannot exercise: at ASTER_APP_SPACE_DIV=1 app space IS
# the panel and the mechanism is not compiled in at all. A second physical
# board does not exist, so the only way to run that code on glass is the same
# board target, the same devicetree, and one Kconfig difference.
#
# What it is for: the app must be told it has 160x120 (the surface log's
# "requested -> granted"), the picture must be visibly 2x-blocky, and a touch
# must land on the app pixel the finger is actually over.
#
# ASTER_APP_SPACE_MAX is panel_long_side / DIV = 320 / 2. Getting it wrong in
# either direction is a compile error, not a runtime surprise: too small and
# the capacity assertion at the top of display.c fires, too large and it is
# merely slack.
CONFIG_ASTER_APP_SPACE_DIV=2
CONFIG_ASTER_APP_SPACE_MAX=160
