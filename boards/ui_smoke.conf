# UI smoke-test overlay (NOT a board profile): boots the built-in native
# launcher to exercise boot auto-show, card-tap launch (via the worker idle
# pump) and the "return home after any app exits" relaunch policy. Build with:
#   west build -- -DEXTRA_CONF_FILE=boards/ui_smoke.conf
# The ESP32-S3 reference board conf already enables the same native launcher;
# this overlay is idempotent (explicit re-enable) for profile-matrix builds.
# (To exercise the *guest-app* launcher path instead, drop ASTER_LAUNCHER_NATIVE
# and set a ASTER_SYSTEM_UI_CUSTOM app id -- see firmware/Kconfig.)
CONFIG_ASTER_SYSTEM_UI_ENABLE=y
CONFIG_ASTER_LAUNCHER_NATIVE=y
