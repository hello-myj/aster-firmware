# Diagnostic overlay only; keep the production connection and buffer budgets.
# Build with -DEXTRA_CONF_FILE=config/diagnostics/network-pools.conf.
CONFIG_NET_SHELL=y
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
CONFIG_NET_STATISTICS=y

CONFIG_NET_PKT_ALLOC_STATS=y
CONFIG_ASTER_NET_POOL_MONITOR=y
