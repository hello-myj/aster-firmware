# ASTER firmware application config (device-side platform)

# Shell (UART0 console): primary control plane of ASTER V1
CONFIG_SHELL=y
# 2026-09: live watermark including `hw img view` (8 KB names moved to PSRAM)
# is 2880 B; 6 KB keeps >2x headroom and frees 2 KB DRAM.
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_SHELL_PROMPT_UART="aster:~$ "

# Immediate logging: ASTER app threads + WAMR must always see logs without
# relying on the deferred log thread during CPU-bound render loops.
CONFIG_LOG_MODE_IMMEDIATE=y

# ASTER runtime
CONFIG_ASTER_WAMR=y
CONFIG_ASTER_WAMR_HEAP_SIZE=1048576

# Speed over size: interpreter + SPI display refresh are the hot paths
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y

# Small-object overhead in PSRAM subheap
CONFIG_ASTER=y

# crc32 for the USB-CDC file-transfer service integrity check
CONFIG_CRC=y

# `kernel heap` -> allocated/free bytes: leak probe for the stress tests
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# File shuttle is USB-CDC (aster_file_svc), not console `fs write`.
CONFIG_FILE_SYSTEM_SHELL=n
# FatFs default 4+4 objects is far too few: the file service pushing over
# USB-CDC, the app worker doing its own media I/O (gallery/music/reader), kv,
# the app registry and the cpfont loader all open files against the one
# volume. Exhausting the file slab shows up as fs_open -> -ENOMEM
# (FR_NOT_ENOUGH_CORE) everywhere.
# 16 is headroom, not a measured floor: it was sized when the tiny_ttf pool
# held one ui.ttf handle open per baked size (8 of them). That pool is gone
# (S3a) and nothing keeps a font file open across a call any more -- cpfont
# closes every handle it opens -- so do not read this number as a
# requirement. What still needs it is the concurrency above, not the fonts.
CONFIG_FS_FATFS_NUM_FILES=16
CONFIG_FS_FATFS_NUM_DIRS=8
# FatFs must be thread-safe here: the file service writes a pushed package
# while the app worker reads its own media (gallery/music/reader) and the UI
# thread loads cpfont bitmaps -- three threads, one volume. The default
# static-BSS LFN
# scratch is a single shared buffer and FS_FATFS_REENTRANT depends on NOT
# using it, so with LFN_MODE_BSS no per-volume mutex is compiled in at all
# and concurrent FAT metadata access silently corrupts the directory/FAT
# (garbage dir entries, phantom ENOENT after resets). Heap LFN + reentrancy
# gives FatFs a real lock per volume.
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_REENTRANT=y
# Names are UTF-8 end to end. Without this FatFs converts LFN UTF-16 through
# the 437 OEM code page, and any character that page cannot hold -- every CJK
# one -- makes put_utf() fail, whereupon ff.c drops the long name and reports
# the 8.3 short name instead. On a card written by a Chinese Windows that
# short name is the raw GBK bytes of the original: it renders as garbage, and
# the UTF-8 path the app builds from it cannot be opened (firmware/patches/
# README.md, change 4).
CONFIG_FS_FATFS_UNICODE=y
# Keep a modest argv cap; long paths fit in CMD_BUFF_SIZE as one argument.
CONFIG_SHELL_ARGC_MAX=16
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
